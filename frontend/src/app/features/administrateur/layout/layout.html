<div class="flex h-screen bg-slate-50">

  <!-- Sidebar -->
  <aside
    class="w-64 h-screen bg-[#0F172A] text-white flex flex-col"
    [class.hidden]="!menuOpen"
  >

    <!-- Logo -->
    <div class="p-6 border-b border-white/10">

      <div
        class="flex items-center justify-center
               bg-white rounded-xl p-3"
      >
        <img
          src="assets/images/classeo-portail-administrateur.png"
          alt="Classeo - Portail administrateur"
          class="h-20 w-auto object-contain"
        >
      </div>

    </div>


    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">

      <!-- Accueil -->
      <a
        routerLink="/administrateur"
        routerLinkActive="bg-[#334155]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Accueil
      </a>


      <!-- Utilisateurs -->
      <a
        routerLink="/administrateur/utilisateurs"
        routerLinkActive="bg-[#334155]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Utilisateurs
      </a>


      <!-- Promotions -->
      <a
        routerLink="/administrateur/promotions"
        routerLinkActive="bg-[#334155]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Promotions
      </a>


      <!-- Filières -->
      <a
        routerLink="/administrateur/filieres"
        routerLinkActive="bg-[#334155]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Filières
      </a>


      <!-- Cursus -->
      <a
        routerLink="/administrateur/cursus"
        routerLinkActive="bg-[#334155]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Cursus
      </a>


      <!-- Cours -->
      <a
        routerLink="/administrateur/cours"
        routerLinkActive="bg-[#334155]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Cours
      </a>


      <!-- Séances -->
      <a
        routerLink="/administrateur/seances"
        routerLinkActive="bg-[#334155]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Séances
      </a>

    </nav>


    <!-- Déconnexion -->
    <div class="p-4 border-t border-white/10">

      <button
        type="button"
        (click)="logout()"
        class="w-full px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Déconnexion
      </button>

    </div>

  </aside>


  <!-- Zone principale -->
  <main class="flex-1 min-w-0">

    <!-- Header -->
    <header
      class="h-16 bg-white border-b border-slate-200
             flex items-center px-4"
    >

      <button
        type="button"
        (click)="toggleMenu()"
        class="p-2 rounded-lg text-slate-500
               hover:bg-slate-100
               transition-colors"
      >
        ☰
      </button>

    </header>


    <!-- Contenu -->
    <div class="p-6 lg:p-8">

      <router-outlet></router-outlet>

    </div>

  </main>

</div>
