<div class="flex min-h-screen bg-slate-50">

  <!-- Sidebar -->
  <aside
    class="w-64 bg-[#1E3A8A] text-white flex flex-col"
    [class.hidden]="!menuOpen"
  >

    <!-- Logo -->
    <div class="p-6 border-b border-white/10">

      <div
        class="flex items-center justify-center
               bg-white rounded-xl p-3"
      >
        <img
          src="assets/images/classeo-portail-eleve.png"
          alt="Classeo - Portail élève"
          class="h-20 w-auto object-contain"
        >
      </div>

    </div>


    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2">

      <a
        routerLink="/eleve"
        routerLinkActive="bg-[#06B6D4]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Accueil
      </a>

      <a
        routerLink="/eleve/cours"
        routerLinkActive="bg-[#06B6D4]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Cours
      </a>

      <a
        routerLink="/eleve/notes"
        routerLinkActive="bg-[#06B6D4]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Notes
      </a>

      <a
        routerLink="/eleve/calendrier"
        routerLinkActive="bg-[#06B6D4]"
        class="block px-4 py-3 rounded-lg
               text-white/80
               hover:bg-white/10 hover:text-white
               transition-colors"
      >
        Calendrier
      </a>

    </nav>

  </aside>


  <!-- Zone principale -->
  <main class="flex-1 min-w-0">

    <!-- Header -->
    <header
      class="h-16 bg-white border-b border-slate-200
             flex items-center px-4"
    >

      <button
        type="button"
        (click)="toggleMenu()"
        class="p-2 rounded-lg text-slate-500
               hover:bg-slate-100 transition-colors"
      >
        ☰
      </button>

    </header>


    <!-- Contenu -->
    <div class="p-6 lg:p-8">

      <router-outlet></router-outlet>

    </div>

  </main>

</div>
